<!-- ===================== MathJax (LaTeX) সংযোজন — শুরু ===================== -->
<script>
window.MathJax = {
    tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        packages: {'[+]': ['cancel', 'bbox', 'color', 'boldsymbol', 'enclose', 'mhchem']}
    },
    loader: {
        load: ['[tex]/cancel', '[tex]/bbox', '[tex]/color', '[tex]/boldsymbol', '[tex]/enclose', '[tex]/mhchem']
    },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea'] },
    // fontCache: 'none' ইচ্ছাকৃতভাবে ব্যবহার করা হয়েছে — এডমিনের PDF এক্সপোর্ট ফিচারে
    // html2canvas দিয়ে প্রতিটি পেজ আলাদাভাবে ক্যাপচার হয়; MathJax-এর ডিফল্ট 'global' ফন্ট-ক্যাশ
    // পদ্ধতিতে সূত্রগুলো <use> ট্যাগ দিয়ে একটা আলাদা জায়গায় রাখা glyph-কে রেফার করে, যা html2canvas
    // ঠিকভাবে ক্যাপচার করতে পারে না (ফলে PDF-এ সূত্র ফাঁকা দেখাতে পারত)। 'none' দিলে প্রতিটি সূত্র
    // নিজের মধ্যেই সম্পূর্ণ self-contained থাকে, তাই স্ক্রিনে দেখানো, ব্রাউজার প্রিন্ট এবং
    // html2canvas — তিন জায়গাতেই নির্ভরযোগ্যভাবে দেখা যায়।
    svg: { mtextInheritFont: true, fontCache: 'none' },
    startup: { typeset: false }
};
</script>
<script>
// $...$ এর ভেতরে বাংলা টেক্সট থাকলে MathJax render এর আগে অটোমেটিক \text{} দিয়ে wrap করবে
// (নাহলে বাংলা অক্ষর LaTeX ইটালিক ভেরিয়েবল হিসেবে ভুলভাবে রেন্ডার হয়)
(function() {
    function wrapBengaliInText(node) {
        if (!node) return;
        const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
        const textNodes = [];
        while (walker.nextNode()) textNodes.push(walker.currentNode);

        textNodes.forEach(textNode => {
            const parent = textNode.parentElement;
            if (!parent) return;
            const tag = parent.tagName;
            if (['SCRIPT', 'STYLE', 'TEXTAREA'].includes(tag)) return;

            const text = textNode.textContent;
            if (!text.includes('$')) return;

            const newText = text.replace(/\$([^$]+)\$/g, (match, inner) => {
                // বাংলা Unicode range: \u0980-\u09FF
                const wrapped = inner.replace(/([\u0980-\u09FF]+)/g, '\\text{$1}');
                return '$' + wrapped + '$';
            });

            if (newText !== text) {
                textNode.textContent = newText;
            }
        });
    }

    const waitForMathJax = setInterval(() => {
        if (window.MathJax && MathJax.typesetPromise) {
            clearInterval(waitForMathJax);
            const original = MathJax.typesetPromise.bind(MathJax);
            MathJax.typesetPromise = function(elements) {
                if (elements) {
                    elements.forEach(el => wrapBengaliInText(el));
                } else {
                    wrapBengaliInText(document.body);
                }
                return original(elements);
            };
        }
    }, 100);
})();
</script>

<script>
/* নিচের মেনুর আসল উচ্চতা মেপে CSS ভ্যারিয়েবলে বসায়; কিবোর্ড খুললে মেনু লুকায় */
(function(){
  var root=document.documentElement;
  function measure(){
    var nav=document.querySelector('.bottomnav');
    if(nav&&nav.offsetHeight) root.style.setProperty('--nav-total', nav.offsetHeight+'px');
  }
  window.addEventListener('load',measure);
  window.addEventListener('resize',measure);
  window.addEventListener('orientationchange',function(){setTimeout(measure,250);});
  if(window.ResizeObserver){ var t=setInterval(function(){var n=document.querySelector('.bottomnav'); if(n){new ResizeObserver(measure).observe(n);clearInterval(t);}},300); }
  var base=window.innerHeight;
  function kb(){
    var vh=(window.visualViewport?window.visualViewport.height:window.innerHeight);
    var typing=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'');
    document.body.classList.toggle('kb-open', typing && (base-vh)>150);
  }
  if(window.visualViewport) window.visualViewport.addEventListener('resize',kb);
  window.addEventListener('focusout',function(){setTimeout(kb,100);});
  window.addEventListener('resize',function(){ if(!document.body.classList.contains('kb-open')) base=Math.max(base,window.innerHeight); });
})();
</script>
